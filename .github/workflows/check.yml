name: check

on:
  push:
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: unit tests
        run: npm test
      # schema/ is a projection of src/formats/, not a second definition. If this fails, someone
      # edited a generated file — regenerate and commit instead.
      - name: the published schemas match the grammar
        run: npm run formats:check
      # The spine, end to end: a document set becomes a page, and the page has to survive the audit we
      # sell. This is the one line in CI that proves the compiler and the verifier agree about reality.
      - name: a document set emits a page that passes our own audit
        run: |
          node bin/spark.js emit test/fixtures/docs/shop.spark.scene.json --out "$RUNNER_TEMP/spine"
          node bin/spark.js check "$RUNNER_TEMP/spine/index.html" --no-color --fail-under 95
          node bin/spark.js emit test/fixtures/docs/shop.spark.scene.json --out "$RUNNER_TEMP/spine2"
          diff -r "$RUNNER_TEMP/spine" "$RUNNER_TEMP/spine2"

      # We gate our own repository on our own tool. If this fails, nothing else matters.
      - name: audit the known-bad fixture (expected to fail the threshold)
        run: |
          set +e
          node bin/spark.js check fixtures/bad.html --no-color --fail-under 90
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from a bad fixture, got $code"
            exit 1
          fi
      - name: audit the known-good fixture (expected to pass)
        run: node bin/spark.js check fixtures/good.html --no-color --fail-under 90
      # Dogfooding: our own report must pass our own tool.
      - name: the generated report must pass its own audit
        run: |
          node bin/spark.js report fixtures/bad.html --out spark-report.html
          node bin/spark.js check spark-report.html --no-color --fail-under 90
      # Reproducibility: with a fixed clock, two runs must be byte-identical.
      - name: the report is byte-identical across runs
        run: |
          export SOURCE_DATE_EPOCH=1762000000
          node bin/spark.js report fixtures/bad.html --out r1.html
          node bin/spark.js report fixtures/bad.html --out r2.html
          diff r1.html r2.html
