name: check

on:
  push:
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: unit tests
        run: npm test
      # A test can check the manifest; only this checks the artifact a stranger receives. Penner's MIT
      # and BSD texts both require the notice in "all copies or substantial portions", and Apache-2.0
      # §4(d) requires the same of NOTICE — so a package that omits them is a licence breach every test
      # in this repository would pass.
      - name: the packed tarball carries the licences it owes
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          tgz=$(ls "$RUNNER_TEMP"/*.tgz | head -1)
          tar -tzf "$tgz" | grep -E '^package/(LICENSE|LICENSE-PENNER\.txt|NOTICE)$' > "$RUNNER_TEMP/found" || true
          if [ "$(wc -l < "$RUNNER_TEMP/found")" -ne 3 ]; then
            echo "the package must ship LICENSE, LICENSE-PENNER.txt and NOTICE; found:"
            cat "$RUNNER_TEMP/found"
            exit 1
          fi
      # schema/ is a projection of src/formats/, not a second definition. If this fails, someone
      # edited a generated file — regenerate and commit instead.
      - name: the published schemas match the grammar
        run: npm run formats:check
      # The spine, end to end: a document set becomes a page, and the page has to survive the audit we
      # sell. This is the one line in CI that proves the compiler and the verifier agree about reality.
      - name: a document set emits a page that passes our own audit
        run: |
          node bin/spark.js emit test/fixtures/docs/shop.spark.scene.json --out "$RUNNER_TEMP/spine"
          node bin/spark.js check "$RUNNER_TEMP/spine/index.html" --no-color --fail-under 95
          node bin/spark.js emit test/fixtures/docs/shop.spark.scene.json --out "$RUNNER_TEMP/spine2"
          diff -r "$RUNNER_TEMP/spine" "$RUNNER_TEMP/spine2"

      # We gate our own repository on our own tool. If this fails, nothing else matters.
      - name: audit the known-bad fixture (expected to fail the threshold)
        run: |
          set +e
          node bin/spark.js check fixtures/bad.html --no-color --fail-under 90
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from a bad fixture, got $code"
            exit 1
          fi
      - name: audit the known-good fixture (expected to pass)
        run: node bin/spark.js check fixtures/good.html --no-color --fail-under 90
      # The gate, on ourselves, with the committed baseline files. Two things this proves that no unit test
      # does: the `baseline` → `--ci` path works end to end on real files in the order a user runs it, and
      # the two fixtures still produce the same findings they did when those baselines were written — so a
      # change in the engine that silently shifts what we report on our own pages shows up as a red build
      # naming the rule, not as a surprise in a client's PR. `npm test` additionally checks the files are
      # byte-current, so a deliberate fixture edit has to regenerate them in the same commit.
      - name: the gate is green on the pages we ship as examples
        uses: ./.github/actions/spark-gate
        with:
          target: fixtures/good.html
          baseline: test/fixtures/gate/good.baseline.json
          spark: node bin/spark.js
          # The disabled path, on the page that has nothing to carry forward: no payload, no summary line.
          sarif: ''
      - name: the gate is green on the known-bad fixture, and writes a payload
        uses: ./.github/actions/spark-gate
        with:
          target: fixtures/bad.html
          baseline: test/fixtures/gate/bad.baseline.json
          spark: node bin/spark.js
          sarif: .spark/bad.sarif
      # `summary.mjs` runs under `|| true`, because a step summary must never be the thing that breaks a
      # build — which is exactly why the dogfooding run checks it produced something. It reads the copy
      # beside the payload, not `$GITHUB_STEP_SUMMARY`: that path is per-step, so from here it is empty.
      - name: the step summary was written from that payload
        run: |
          grep "MR-Spark gate ✓ no new findings" .spark/summary.md
          grep -q "already in the baseline" .spark/summary.md
          grep -q "score spec" .spark/summary.md
          test -s .spark/bad.sarif
      # Dogfooding: our own report must pass our own tool.
      - name: the generated report must pass its own audit
        run: |
          node bin/spark.js report fixtures/bad.html --out spark-report.html
          node bin/spark.js check spark-report.html --no-color --fail-under 90
      # Reproducibility: with a fixed clock, two runs must be byte-identical.
      - name: the report is byte-identical across runs
        run: |
          export SOURCE_DATE_EPOCH=1762000000
          node bin/spark.js report fixtures/bad.html --out r1.html
          node bin/spark.js report fixtures/bad.html --out r2.html
          diff r1.html r2.html
